name: SPM release

on:
  repository_dispatch:
    types: [spm-release]

concurrency:
  group: spm-release
  cancel-in-progress: false

jobs:
  spm-release:
    name: SPM release
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "Doordeck Development"
          git config --global user.email "development@doordeck.com"

      - name: Update package swift
        run: |
          sed -E -i '' \
            -e 's|(url: ")[^"]*(")|\1https://cdn.doordeck.com/xcframework/v${{ github.event.client_payload.tag }}/DoordeckSDK.xcframework.zip\2|' \
            -e 's|(checksum: ")[^"]*(")|\1${{ github.event.client_payload.checksum }}\2|' \
            "Package.swift"
          git diff --exit-code Package.swift && \
            { echo "::error::Package.swift unchanged - already at v${{ github.event.client_payload.tag }}?"; exit 1; } || true

      - name: Commit and tag
        run: |
          git add Package.swift
          git commit -m "Checksum and version update v${{ github.event.client_payload.tag }}"
          git tag -a "v${{ github.event.client_payload.tag }}" \
            -m "Release v${{ github.event.client_payload.tag }}"
          git push --atomic origin main "v${{ github.event.client_payload.tag }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.event.client_payload.tag }}" \
            --title "Release v${{ github.event.client_payload.tag }}" \
            --verify-tag \
            --generate-notes