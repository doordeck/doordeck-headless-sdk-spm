name: SPM release

on:
  repository_dispatch:
    types: [spm-release]

concurrency:
  group: spm-release
  cancel-in-progress: false

jobs:
  spm-release:
    name: SPM release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.SPM_RELEASE_DEPLOY_KEY }}

      - name: Validate payload
        env:
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid or missing tag in client_payload: '$TAG'"
            exit 1
          fi

      - name: Setup Git
        run: |
          git config --global user.name "Doordeck Development"
          git config --global user.email "development@doordeck.com"

      - name: Download SPM package
        env:
          TAG: ${{ github.event.client_payload.tag }}
        run: curl -fSOL https://cdn.doordeck.com/xcframework/v${TAG}/DoordeckSDK.xcframework.zip

      - name: Compute package checksum
        id: checksum
        run: echo "checksum=$(sha256sum DoordeckSDK.xcframework.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Update package swift
        env:
          TAG: ${{ github.event.client_payload.tag }}
          CHECKSUM: ${{ steps.checksum.outputs.checksum }}
        run: |
          sed -E -i \
            -e "s|(url: \")[^\"]*(\")|\1https://cdn.doordeck.com/xcframework/v${TAG}/DoordeckSDK.xcframework.zip\2|" \
            -e "s|(checksum: \")[^\"]*(\")|\1${CHECKSUM}\2|" \
            "Package.swift"
          if git diff --quiet Package.swift; then
            echo "::error::Package.swift unchanged - already at v${TAG}?"
            exit 1
          fi
          git diff Package.swift

      - name: Commit and tag
        env:
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          git add Package.swift
          git commit -m "Checksum and version update v${TAG}"
          git tag -a "v${TAG}" -m "Release v${TAG}"
          git push --atomic origin main "v${TAG}"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          gh release create "v${TAG}" \
            --title "Release v${TAG}" \
            --verify-tag \
            --generate-notes